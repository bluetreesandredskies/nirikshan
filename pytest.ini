[pytest]
# Adds the repo root to sys.path for every test session, so test files can
# do `from model.safety_net import ...`, `from backend.app.fusion import ...`,
# etc. regardless of whether pytest is invoked as `pytest ...` or
# `python -m pytest ...`, and regardless of which directory it's run from
# (as long as it's run from, or below, the repo root).
#
# Without this, `pytest tests\test_safety_net.py` fails with
# "ModuleNotFoundError: No module named 'model'" on Windows, because plain
# `pytest` (unlike `python -m pytest`) does not add the current directory to
# sys.path -- it only auto-inserts each test file's own containing
# directory (tests\), not the project root above it.
pythonpath = .
testpaths = tests
